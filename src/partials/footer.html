{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-16 border-t-2 border-gray-700 py-8">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8 text-center md:text-left">
      <div class="mb-8 md:mb-0">
        <div class="flex items-center justify-center md:justify-start mb-4">
          <img
            id="footer-logo"
            src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/manaLogo.svg{{/if}}"
            alt="{{#if brandName}}{{brandName}}{{else}}Bento PDF{{/if}} Logo"
            class="h-15 w-42 bg-gray-400 rounded-xl border border-indigo-600 px-3"
          />
          <span id="footer-brand" class="text-xl font-bold text-white">{{#if brandName}}{{brandName}}{{else}} {{/if}}</span>
        </div>
        <p id="footer-copyright" class="text-gray-400 text-sm" {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}>
          {{#if footerText}}{{footerText}}{{else}}&copy; 2026 BentoPDF. All rights reserved.{{/if}}
        </p>
        <p class="text-gray-400 text-xs mt-2">
          <span data-i18n="footer.version">Version</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>
      <div class="ml-8">
        <p class="text-lg">Mana Energy Pak</p>
        <p class="text-base text-gray-400 mt-1.5">ICT Department</p>
      </div>
      <div>

      </div>

      
      

     
    </div>
  </div>
</footer>
{{/if}}
